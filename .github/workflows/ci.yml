name: Build Qt Library
env:
  QT_BRANCH: 'dev'
  SCCACHE_GHA_ENABLED: "true"
  OPENSSL_VERSION: openssl-4.0
  INIT_FLAGS: --module-subset=qtbase,qtdeclarative,-qtlanguageserver,-qtquicktimeline,-qtquick3d,-qtimageformats,-qtsvg --branch --no-update
  SHARED_COMPILER_FLAGS: "-O2 -DNDEBUG -pipe -fPIC"
  SHARED_LINKER_FLAGS: "-fuse-ld=lld -Wl,-S,--icf=safe"
  APPLY_CHERRY_PICK: true
  SHARED_FLAGS: -release -no-feature-testlib -DQT_NO_PACKAGE_VERSION_CHECK=ON -DQT_NO_PACKAGE_VERSION_INCOMPATIBLE_WARNING=ON -c++std c++2b
    -no-feature-hijricalendar -no-feature-islamiccivilcalendar -nomake tests -nomake examples -submodules qtbase,qtdeclarative -no-feature-whatsthis
    -skip qtlanguageserver,qtquicktimeline,qtquick3d,qtimageformats,qtsvg -qt-zlib -qt-libjpeg -qt-libpng -qt-pcre -qt-harfbuzz -qt-freetype -reduce-exports
    -DQT_BUILD_EXAMPLES_BY_DEFAULT=OFF -DQT_BUILD_TESTS_BY_DEFAULT=OFF -DQT_BUILD_TOOLS_BY_DEFAULT=ON -no-feature-calendarwidget -no-feature-textodfwriter
    -no-feature-imageformat_ppm -no-warnings-are-errors -disable-deprecated-up-to 0x070000 -no-feature-test_gui -no-feature-jalalicalendar -no-feature-sctp
    -no-feature-imageformat_bmp -feature-relocatable -no-feature-pdf -no-feature-private_tests -no-feature-dbus -no-feature-vnc -no-feature-openvg -no-glib
    -no-feature-localserver -no-feature-libproxy -no-feature-vkgen -no-feature-xml -no-feature-printsupport -no-feature-udpsocket -no-feature-brotli -no-xcb
    -no-feature-quickcontrols2-fluentwinui3 -no-feature-quickcontrols2-imagine -no-feature-quickcontrols2-universal -no-feature-qml-labs -no-sbom -no-inotify
    -no-feature-textmarkdownreader -no-feature-textmarkdownwriter -no-feature-movie -no-feature-undocommand -no-feature-concatenatetablesproxymodel -no-cups
    -no-feature-undogroup -no-feature-ctf -no-feature-widgets -no-feature-imageformat_xbm -no-feature-sortfilterproxymodel -no-feature-filesystemwatcher
    -nomake examples -nomake tests -nomake benchmarks -nomake manual-tests -nomake minimal-static-tests -no-feature-gssapi -no-feature-accessibility
    -no-feature-sql -no-feature-graphicsframecapture -DFEATURE_no_direct_extern_access=ON -unity-build
  EXTRA_FLAGS: -no-feature-qml-network -no-feature-qml-ssl -no-feature-quickcontrols2-fusion
  QT_BASE_CHERRY_PICK: 712956 524178 644402 680266 737729 754065 753848 752561 754129 754130 751156 751138 751141 751142 751140 751139 751157 737729 756473
  QT_DECLARATIVE_CHERRY_PICK: 622692 695153 727806 743838 754298 754121 754107 753876
    
on:
  workflow_dispatch:
    inputs:
      qt_branch:
        description: 'Qt branch/tag to build'
        required: true
        default: "dev"
        type: string
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-slim
    outputs:
      qt_branch: ${{ steps.set-branch.outputs.qt_branch }}
    steps:
      - name: Set branch
        id: set-branch
        run: |
          if [ "${{ github.event.inputs.qt_branch }}" != "" ]; then
            echo "qt_branch=${{ github.event.inputs.qt_branch }}" >> $GITHUB_OUTPUT
          else
            echo "qt_branch=${{ env.QT_BRANCH }}" >> $GITHUB_OUTPUT
          fi
          
  build-windows:
    needs: setup
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [release]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Configure Windows Defender exclusions
        shell: powershell
        run: Add-MpPreference -ExclusionPath ${{ github.workspace }}
    
      - name: Checkout Qt
        uses: actions/checkout@v7
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 1
          submodules: false
          
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
            
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v3
   
      - name: Initialize Qt submodules
        run: init-repository.bat ${{ env.INIT_FLAGS }}

      - name: Apply QT cherry picks
        if: (env.QT_BASE_CHERRY_PICK != '' || env.QT_DECLARATIVE_CHERRY_PICK != '') && env.APPLY_CHERRY_PICK != 'false'
        shell: bash
        run: |
          apply_changes() {
            local repo=$1
            shift
            local workspace=$(echo "${{ github.workspace }}" | sed 's/\\/\//g')
            for change in "$@"; do
              cd "$workspace/$repo"
              info=$(curl -sf "https://codereview.qt-project.org/changes/qt%2F${repo}~${change}?o=CURRENT_REVISION" | tail -n +2)
              read -r commit status < <(jq -r '[.current_revision // "", .status // "UNKNOWN"] | @tsv' <<< "$info")
              [ "$status" = "MERGED" ] && echo "Change $change is already merged" || echo "Change $change status: $status"
              [ -z "$commit" ] && { echo "::error::Change $change not found in $repo"; exit 1; }
              git fetch https://codereview.qt-project.org/qt/$repo "$commit" || exit 1
              git cherry-pick --no-commit FETCH_HEAD || { echo "::error::Cherry-pick failed for $change"; git cherry-pick --abort; exit 1; }
            done
          }
          [ -n "${QT_BASE_CHERRY_PICK}" ] && apply_changes qtbase ${QT_BASE_CHERRY_PICK}
          [ -n "${QT_DECLARATIVE_CHERRY_PICK}" ] && apply_changes qtdeclarative ${QT_DECLARATIVE_CHERRY_PICK}
    
      - name: Experimental library improvement
        shell: bash
        run: |
          set -e
          echo "Downloading experimental changes  ..."
          curl -fsSL https://raw.githubusercontent.com/reg31/qt/main/files/qsgthreadedrenderloop.cpp -o qtdeclarative/src/quick/scenegraph/qsgthreadedrenderloop.cpp
          echo "Download completed  ..."
          
      - name: Configure
        run: |
          set "SCCACHE_CLIENT_SIDE=true"
          set "CMAKE_C_COMPILER_LAUNCHER=sccache"
          set "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          set "CC=C:\ProgramData\mingw64\mingw64\bin\x86_64-w64-mingw32-gcc.exe"
          set "CXX=C:\ProgramData\mingw64\mingw64\bin\x86_64-w64-mingw32-g++.exe"
          set "OUTPUT_DIR=%CD%\qt-windows-mingw-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
      
          mkdir build
          cd build
          
          ..\configure.bat -schannel -prefix "%OUTPUT_DIR%" ${{ env.SHARED_FLAGS }} -unity-build-batch-size %NUMBER_OF_PROCESSORS% ^
           -- -DCMAKE_CXX_FLAGS_RELEASE="${{ env.SHARED_COMPILER_FLAGS }} -s -fno-semantic-interposition -fpch-preprocess" ^
              -DCMAKE_C_FLAGS_RELEASE="${{ env.SHARED_COMPILER_FLAGS }} -s -fno-semantic-interposition -fpch-preprocess"
              
      - name: List features
        run: configure.bat -list-features

      - name: Build Qt
        run: |
          cd build
          cmake --build . -j%NUMBER_OF_PROCESSORS%
          cmake --install . --strip
          
      - name: Package artifacts
        run: |
          set "OUTPUT_NAME=qt-windows-mingw-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          Xcopy C:\ProgramData\mingw64\mingw64\bin\*.dll .\%OUTPUT_NAME%\bin\ /c /i /s /y /r
          7z a %OUTPUT_NAME%.zip .\%OUTPUT_NAME%\* -x!.\%OUTPUT_NAME%\share -x!.\%OUTPUT_NAME%\sbom -x!.\%OUTPUT_NAME%\doc
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qt-windows-mingw
          path: ./qt-windows-mingw-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}.zip

  build-android:
    needs: setup
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [arm64-v8a, armeabi-v7a]
        build_type: [release]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Configure Windows Defender exclusions
        shell: powershell
        run: Add-MpPreference -ExclusionPath ${{ github.workspace }}
          
      - name: Checkout Qt
        uses: actions/checkout@v7
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 1
          submodules: false
          
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
            
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 25
          check-latest: true
        
      - name: Initialize Qt submodules
        run: init-repository.bat ${{ env.INIT_FLAGS }}

      - name: Apply QT cherry picks
        if: (env.QT_BASE_CHERRY_PICK != '' || env.QT_DECLARATIVE_CHERRY_PICK != '') && env.APPLY_CHERRY_PICK != 'false'
        shell: bash
        run: |
          apply_changes() {
            local repo=$1
            shift
            local workspace=$(echo "${{ github.workspace }}" | sed 's/\\/\//g')
            for change in "$@"; do
              cd "$workspace/$repo"
              info=$(curl -sf "https://codereview.qt-project.org/changes/qt%2F${repo}~${change}?o=CURRENT_REVISION" | tail -n +2)
              read -r commit status < <(jq -r '[.current_revision // "", .status // "UNKNOWN"] | @tsv' <<< "$info")
              [ "$status" = "MERGED" ] && echo "Change $change is already merged" || echo "Change $change status: $status"
              [ -z "$commit" ] && { echo "::error::Change $change not found in $repo"; exit 1; }
              git fetch https://codereview.qt-project.org/qt/$repo "$commit" || exit 1
              git cherry-pick --no-commit FETCH_HEAD || { echo "::error::Cherry-pick failed for $change"; git cherry-pick --abort; exit 1; }
            done
          }
          [ -n "${QT_BASE_CHERRY_PICK}" ] && apply_changes qtbase ${QT_BASE_CHERRY_PICK}
          [ -n "${QT_DECLARATIVE_CHERRY_PICK}" ] && apply_changes qtdeclarative ${QT_DECLARATIVE_CHERRY_PICK}

      - name: Download prebuilt Qt Host
        run: |
          mkdir qt-windows-mingw-release-dev
          cd qt-windows-mingw-release-dev
          set QT_ARCHIVE=qt-windows-mingw-release-dev.zip
          curl -fsSL -o %QT_ARCHIVE% https://github.com/reg31/qt/releases/latest/download/%QT_ARCHIVE%
          7z x %QT_ARCHIVE%
          
      - name: Download prebuilt openssl
        run: |
          mkdir openssl
          cd openssl
          set OPENSSL_ARCHIVE=${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}.zip
          curl -fsSL -o %OPENSSL_ARCHIVE% https://github.com/reg31/openssl/releases/latest/download/%OPENSSL_ARCHIVE%
          7z x %OPENSSL_ARCHIVE%
    
      - name: Extract config folders
        run: |
          mkdir configFolders
          cd configFolders
          curl -fsSL -o android_bin.7z https://raw.githubusercontent.com/reg31/qt/main/files/android_bin.7z
          7z x android_bin.7z

      - name: Append Qt configuration
        if: matrix.arch == 'armeabi-v7a'
        run: Xcopy .\configFolders\bin\arm\ .\configFolders\bin\ /c /i /s /y /r

      - name: Append Qt configuration
        if: matrix.arch == 'arm64-v8a'
        run: Xcopy .\configFolders\bin\arm64\ .\configFolders\bin\ /c /i /s /y /r

      - name: Cleanup Qt configuration
        run: |
          cd .\configFolders\bin
          rmdir /s /q arm
          rmdir /s /q arm64

      - name: Experimental library improvement
        shell: bash
        run: |
          set -e
          echo "Downloading experimental changes  ..."
          curl -fsSL https://raw.githubusercontent.com/reg31/qt/main/files/qsgthreadedrenderloop.cpp -o qtdeclarative/src/quick/scenegraph/qsgthreadedrenderloop.cpp
          echo "Download completed  ..."

      - name: Setup Android Tools
        run:  cmake -DACTION_RESOLVE_GRADLE=ON -DQT_ROOT_DIR=D:/a/qt/qt/qtbase -DGRADLE_PROJECT_DIR=D:/a/qt/qt/qtbase/src/android/jar -P D:/a/qt/qt/qtbase/cmake/QtSetupAndroid.cmake
        
      - name: Configure Android Qt
        run: |
          set "OUTPUT_DIR=%CD:\=/%/qt-android-${{ matrix.arch }}-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          set "QT_ROOT_DIR=%CD:\=/%/qt-windows-mingw-release-dev"
          set "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          set "CMAKE_C_COMPILER_LAUNCHER=sccache"
          set "OPENSSL_ROOT=%CD:\=/%/openssl"
          set "SCCACHE_CLIENT_SIDE=true"
          
          mkdir build
          cd build
          
            ..\configure.bat -prefix "%OUTPUT_DIR%" -qt-host-path "%QT_ROOT_DIR%" ${{ env.SHARED_FLAGS }} ${{ env.EXTRA_FLAGS }} -skip qtshadertools -unity-build ^
              -android-abis ${{ matrix.arch }} -android-ndk "%ANDROID_NDK_LATEST_HOME%" -android-sdk "%ANDROID_SDK_ROOT%" -openssl-runtime ^
              -unity-build-batch-size %NUMBER_OF_PROCESSORS% -reduce-relocations -- -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT%" ^
              -DCMAKE_CXX_FLAGS_RELEASE="${{ env.SHARED_COMPILER_FLAGS }} -Xclang -fno-pch-timestamp -fno-semantic-interposition" ^
              -DCMAKE_C_FLAGS_RELEASE="${{ env.SHARED_COMPILER_FLAGS }} -Xclang -fno-pch-timestamp -fno-semantic-interposition" ^
              -DCMAKE_SHARED_LINKER_FLAGS="${{ env.SHARED_LINKER_FLAGS }} -Wl,--pack-dyn-relocs=android+relr,--use-android-relr-tags -Wl,-Bsymbolic-functions,--hash-style=gnu"
                      
      - name: List features
        run: configure.bat -list-features          

      - name: Build Android Qt
        run: |
          cd build          
          cmake --build . -j%NUMBER_OF_PROCESSORS%
          cmake --install . --strip
          
      - name: Package artifacts
        run: |
          set "OUTPUT_NAME=qt-android-${{ matrix.arch }}-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          Xcopy .\configFolders\bin\ .\%OUTPUT_NAME%\bin\ /c /i /s /y /r          
          7z a %OUTPUT_NAME%.zip .\%OUTPUT_NAME%\* -x!.\%OUTPUT_NAME%\share -x!.\%OUTPUT_NAME%\sbom -x!.\%OUTPUT_NAME%\doc
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qt-android-${{ matrix.arch }}
          path: ./qt-android-${{ matrix.arch }}-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}.zip

  build-macos:
    needs: setup
    runs-on: macos-26
    strategy:
      matrix:
        build_type: [release]
    steps:
      - name: Checkout Qt
        uses: actions/checkout@v7
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 1
          submodules: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Setup lld
        run: brew install lld

      - name: Initialize Qt submodules
        run: perl init-repository ${{ env.INIT_FLAGS }}

      - name: Apply QT cherry picks
        if: (env.QT_BASE_CHERRY_PICK != '' || env.QT_DECLARATIVE_CHERRY_PICK != '') && env.APPLY_CHERRY_PICK != 'false'
        shell: bash
        run: |
          apply_changes() {
            local repo=$1
            shift
            local workspace=$(echo "${{ github.workspace }}" | sed 's/\\/\//g')
            for change in "$@"; do
              cd "$workspace/$repo"
              info=$(curl -sf "https://codereview.qt-project.org/changes/qt%2F${repo}~${change}?o=CURRENT_REVISION" | tail -n +2)
              read -r commit status < <(jq -r '[.current_revision // "", .status // "UNKNOWN"] | @tsv' <<< "$info")
              [ "$status" = "MERGED" ] && echo "Change $change is already merged" || echo "Change $change status: $status"
              [ -z "$commit" ] && { echo "::error::Change $change not found in $repo"; exit 1; }
              git fetch https://codereview.qt-project.org/qt/$repo "$commit" || exit 1
              git cherry-pick --no-commit FETCH_HEAD || { echo "::error::Cherry-pick failed for $change"; git cherry-pick --abort; exit 1; }
            done
          }
          [ -n "${QT_BASE_CHERRY_PICK}" ] && apply_changes qtbase ${QT_BASE_CHERRY_PICK}
          [ -n "${QT_DECLARATIVE_CHERRY_PICK}" ] && apply_changes qtdeclarative ${QT_DECLARATIVE_CHERRY_PICK}

      - name: Experimental library improvement
        shell: bash
        run: |
          set -e
          echo "Downloading experimental changes  ..."
          curl -fsSL https://raw.githubusercontent.com/reg31/qt/main/files/qsgthreadedrenderloop.cpp -o qtdeclarative/src/quick/scenegraph/qsgthreadedrenderloop.cpp
          echo "Download completed  ..."

      - name: Configure
        run: |
          OUTPUT_DIR=$(pwd)/qt-macos-release-${{ needs.setup.outputs.qt_branch }}
          CPU_COUNT=$(sysctl -n hw.logicalcpu)
          EXTRA_FLAGS="-Xclang -fno-pch-timestamp"
          export CMAKE_CXX_COMPILER_LAUNCHER="sccache"
          export CMAKE_C_COMPILER_LAUNCHER="sccache"
          export SCCACHE_CLIENT_SIDE="true"
          
          mkdir -p build && cd build
          
          ../configure ${{ env.SHARED_FLAGS }} -unity-build -securetransport -feature-appstore-compliant -prefix $OUTPUT_DIR -framework -unity-build-batch-size $CPU_COUNT \
          -- -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" -DCMAKE_SHARED_LINKER_FLAGS="${{ env.SHARED_LINKER_FLAGS }} -Wl,-dead_strip" \
            -DCMAKE_CXX_FLAGS_RELEASE="${{ env.SHARED_COMPILER_FLAGS }} $EXTRA_FLAGS" \
            -DCMAKE_C_FLAGS_RELEASE="${{ env.SHARED_COMPILER_FLAGS }} $EXTRA_FLAGS"

          ../configure -list-features

      - name: Build
        run: |
          cd build
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install . --strip

      - name: Package artifacts
        run: |
          OUTPUT_NAME=qt-macos-release-${{ needs.setup.outputs.qt_branch }}
          xattr -cr ./$OUTPUT_NAME
          find ./$OUTPUT_NAME -type f -exec chmod +x {} +
          7z a $OUTPUT_NAME.zip ./$OUTPUT_NAME/* -x!./$OUTPUT_NAME/share -x!./$OUTPUT_NAME/sbom -x!./$OUTPUT_NAME/doc

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qt-macos
          path: |
            qt-macos-release-${{ needs.setup.outputs.qt_branch }}.zip

  build-ios:
    needs: setup
    runs-on: macos-26
    strategy:
      matrix:
        build_type: [release]
    steps:
      - name: Checkout Qt
        uses: actions/checkout@v7
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 1
          submodules: false

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        
      - name: Initialize Qt submodules
        run: perl init-repository ${{ env.INIT_FLAGS }}

      - name: Apply QT cherry picks
        if: (env.QT_BASE_CHERRY_PICK != '' || env.QT_DECLARATIVE_CHERRY_PICK != '') && env.APPLY_CHERRY_PICK != 'false'
        shell: bash
        run: |
          apply_changes() {
            local repo=$1
            shift
            local workspace=$(echo "${{ github.workspace }}" | sed 's/\\/\//g')
            for change in "$@"; do
              cd "$workspace/$repo"
              info=$(curl -sf "https://codereview.qt-project.org/changes/qt%2F${repo}~${change}?o=CURRENT_REVISION" | tail -n +2)
              read -r commit status < <(jq -r '[.current_revision // "", .status // "UNKNOWN"] | @tsv' <<< "$info")
              [ "$status" = "MERGED" ] && echo "Change $change is already merged" || echo "Change $change status: $status"
              [ -z "$commit" ] && { echo "::error::Change $change not found in $repo"; exit 1; }
              git fetch https://codereview.qt-project.org/qt/$repo "$commit" || exit 1
              git cherry-pick --no-commit FETCH_HEAD || { echo "::error::Cherry-pick failed for $change"; git cherry-pick --abort; exit 1; }
            done
          }
          [ -n "${QT_BASE_CHERRY_PICK}" ] && apply_changes qtbase ${QT_BASE_CHERRY_PICK}
          [ -n "${QT_DECLARATIVE_CHERRY_PICK}" ] && apply_changes qtdeclarative ${QT_DECLARATIVE_CHERRY_PICK}

      - name: Experimental library improvement
        shell: bash
        run: |
          set -e
          echo "Downloading experimental changes  ..."
          curl -fsSL https://raw.githubusercontent.com/reg31/qt/main/files/qsgthreadedrenderloop.cpp -o qtdeclarative/src/quick/scenegraph/qsgthreadedrenderloop.cpp
          echo "Download completed  ..."

      - name: Extract config folder
        run: |
          mkdir configFolder
          cd configFolder
          curl -fsSL -o ios_bin.7z https://raw.githubusercontent.com/reg31/qt/main/files/ios_bin.7z
          7z x ios_bin.7z
      
      - name: Download prebuilt Qt Host
        run: |
          mkdir -p qt-macos-release-dev
          cd qt-macos-release-dev
          QT_ARCHIVE=qt-macos-release-dev.zip
          curl -fsSL -o $QT_ARCHIVE https://github.com/reg31/qt/releases/latest/download/$QT_ARCHIVE
          7z x $QT_ARCHIVE

      - name: Configure and build for iOS
        run: | 
          OUTPUT_DIR=$(pwd)/qt-ios-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}
          EXTRA_FLAGS="-march=armv8.2-a+dotprod -Xclang -fno-pch-timestamp"          
          HOST_PATH=$(pwd)/qt-macos-release-dev
          CPU_COUNT=$(sysctl -n hw.logicalcpu)
          
          export CMAKE_CXX_COMPILER_LAUNCHER="sccache"
          export CMAKE_C_COMPILER_LAUNCHER="sccache"
          export SCCACHE_CLIENT_SIDE="true"
          
          mkdir -p build
          cd build
          
          ../configure -platform macx-ios-clang ${{ env.SHARED_FLAGS }} ${{ env.EXTRA_FLAGS }} -unity-build -feature-appstore-compliant -unity-build-batch-size $CPU_COUNT \
          -skip qtshadertools -gc-binaries -securetransport -prefix $OUTPUT_DIR -qt-host-path $HOST_PATH -framework -- -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_C_FLAGS="${{ env.SHARED_COMPILER_FLAGS }}  $EXTRA_FLAGS" \
            -DCMAKE_CXX_FLAGS="${{ env.SHARED_COMPILER_FLAGS }} $EXTRA_FLAGS" \
            -DCMAKE_SHARED_LINKER_FLAGS="${{ env.SHARED_LINKER_FLAGS }} -Wl,-dead_strip"
            
          ../configure -list-features
          
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install . --strip
          
      - name: Package artifacts
        run: |
          OUTPUT_NAME=qt-ios-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}
          cp -R ./configFolder/bin/* ./$OUTPUT_NAME/bin/
          xattr -cr ./$OUTPUT_NAME
          find ./$OUTPUT_NAME -type f -exec chmod +x {} +
          7z a $OUTPUT_NAME.zip ./$OUTPUT_NAME/* -x!./$OUTPUT_NAME/share -x!./$OUTPUT_NAME/sbom -x!./$OUTPUT_NAME/doc

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: qt-ios
          path: |
            qt-ios-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}.zip

  release:
    needs: [setup, build-windows, build-android, build-macos, build-ios]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success'}}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
          
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.run_id }}
          name: "Qt Library - Build"
          fail_on_unmatched_files: false
          body: |
            Automated build of Qt ${{ needs.setup.outputs.qt_branch }} branch
            With qtbase and qtdeclarative, some features are disabled to minimize footprint
            
            This build includes binaries for:
            - Windows MINGW (x64)
            - Android (armeabi-v7a, arm64-v8a)
            - iOS
            - macOS (Universal Binary)
          files: |
            qt-windows-mingw/*.zip
            qt-android-armeabi-v7a/*.zip
            qt-android-arm64-v8a/*.zip
            qt-macos/*.zip
            qt-ios/*.zip
          
      - name: Cleanup repository
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
