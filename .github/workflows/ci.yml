                  <UpdateFile CompressedSize="{ARM64_COMP}" UncompressedSize="{ARM64_UNCOMP}" OS="Any" SHA1="{ARM64_SHA1}"/>
              </PackageUpdate>
              <PackageUpdate>
                  <Name>com.qt.dev.android.armv7</Name>
                  <DisplayName>Qt Dev - Android ARMv7 (armeabi-v7a)</DisplayName>
                  <Version>{version}</Version>
                  <ReleaseDate>{date}</ReleaseDate>
                  <Default>false</Default>
                  <DownloadableArchives>qt-android-armeabi-v7a-release-dev.7z</DownloadableArchives>
                  <UpdateFile CompressedSize="{ARMV7_COMP}" UncompressedSize="{ARMV7_UNCOMP}" OS="Any" SHA1="{ARMV7_SHA1}"/>
              </PackageUpdate>
              <PackageUpdate>
                  <Name>com.qt.dev.macos</Name>
                  <DisplayName>Qt Dev - macOS (Universal)</DisplayName>
                  <Version>{version}</Version>
                  <ReleaseDate>{date}</ReleaseDate>
                  <Default>true</Default>
                  <DownloadableArchives>qt-macos-release-dev.7z</DownloadableArchives>
                  <UpdateFile CompressedSize="{MACOS_COMP}" UncompressedSize="{MACOS_UNCOMP}" OS="Any" SHA1="{MACOS_SHA1}"/>
              </PackageUpdate>
              <PackageUpdate>
                  <Name>com.qt.dev.ios</Name>
                  <DisplayName>Qt Dev - iOS</DisplayName>
                  <Version>{version}</Version>
                  <ReleaseDate>{date}</ReleaseDate>
                  <Default>true</Default>
                  <DownloadableArchives>qt-ios-release-dev.7z</DownloadableArchives>
                  <UpdateFile CompressedSize="{IOS_COMP}" UncompressedSize="{IOS_UNCOMP}" OS="Any" SHA1="{IOS_SHA1}"/>
              </PackageUpdate>
          </Updates>
          """

open("Updates.xml", "w").write(xml)
print("Updates.xml generated.")
PYEOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: "Qt Library - Build"
          fail_on_unmatched_files: false
          body: |
            Automated build of Qt ${{ needs.setup.outputs.qt_branch }} branch
            With qtbase and qtdeclarative, some features are disabled to minimize footprint

            This build includes binaries for:
            - Windows MINGW (x64)
            - Android (armeabi-v7a, arm64-v8a)
            - iOS
            - macOS (Universal Binary)

            **Installers** (recommended — includes auto-update via maintenance tool):
            - `qt-dev-installer-windows.exe` — installs Windows + Android kits
            - `qt-dev-installer-macos.zip` — installs macOS + iOS kits
          files: |
            qt-windows-mingw/*.zip
            qt-android-armeabi-v7a/*.zip
            qt-android-arm64-v8a/*.zip
            qt-macos/*.zip
            qt-ios/*.zip
            qt-dev-installer-windows/qt-dev-installer-windows.exe
            qt-dev-installer-macos/qt-dev-installer-macos.zip
            archives-windows/*.7z
            archives-macos/*.7z
            Updates.xml

      - name: Cleanup old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
