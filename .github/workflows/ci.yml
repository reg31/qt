name: Build Qt Library
env:
  QT_BRANCH: 'dev'
  JAVA_VERSION: 25
  SCCACHE_GHA_ENABLED: "true"
  OPENSSL_VERSION: openssl-3.6
  INIT_FLAGS: --module-subset=qtbase,qtdeclarative --branch --no-update
  NO_STRIP_BUILD_FLAGS: -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG"
  WITH_STRIP_BUILD_FLAGS: -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG -s" -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG -s"
  SHARED_FLAGS: -release -no-feature-testlib -DQT_NO_PACKAGE_VERSION_CHECK=ON -DQT_NO_PACKAGE_VERSION_INCOMPATIBLE_WARNING=ON -c++std c++2b -no-pch
    -no-feature-hijricalendar -no-feature-islamiccivilcalendar -nomake tests -nomake examples -submodules qtbase,qtdeclarative -no-feature-sql -no-sbom
    -skip qtlanguageserver,qtquicktimeline,qtquick3d,qtimageformats -qt-zlib -qt-libjpeg -qt-libpng -qt-pcre -qt-harfbuzz -qt-freetype -reduce-exports
    -DQT_BUILD_EXAMPLES_BY_DEFAULT=OFF -DQT_BUILD_TESTS_BY_DEFAULT=OFF -DQT_BUILD_TOOLS_BY_DEFAULT=ON -no-feature-calendarwidget -no-feature-textodfwriter
    -no-feature-imageformat_ppm -no-warnings-are-errors -disable-deprecated-up-to 0x070000 -no-feature-test_gui -no-feature-jalalicalendar -no-feature-sctp
    -no-feature-imageformat_bmp -feature-relocatable -no-feature-pdf -no-feature-private_tests -no-feature-dbus -no-feature-vnc -no-feature-openvg
    -no-feature-localserver -no-feature-libproxy -no-feature-vkgen -no-feature-xml -no-feature-printsupport -no-feature-udpsocket -no-feature-brotli
    -no-feature-quickcontrols2-imagine -no-feature-quickcontrols2-universal -no-feature-gssapi -no-feature-whatsthis -no-feature-graphicsframecapture 
    -no-feature-quickcontrols2-fluentwinui3 -no-feature-textmarkdownreader -no-feature-textmarkdownwriter -no-feature-movie -no-feature-undocommand 
    -no-feature-undogroup -no-feature-ctf -no-feature-widgets -no-feature-imageformat_xbm -no-feature-sortfilterproxymodel -no-feature-filesystemwatcher
    -DFEATURE_regularexpression=OFF -no-feature-concatenatetablesproxymodel -DFEATURE_no_direct_extern_access=ON
  EXTRA_FLAGS: -no-feature-qml-network -no-feature-qml-ssl -no-feature-quickcontrols2-fusion
    
on:
  workflow_dispatch:
    inputs:
      qt_branch:
        description: 'Qt branch/tag to build'
        required: true
        default: "dev"
        type: string
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      qt_branch: ${{ steps.set-branch.outputs.qt_branch }}
    steps:
      - name: Set branch
        id: set-branch
        run: |
          if [ "${{ github.event.inputs.qt_branch }}" != "" ]; then
            echo "qt_branch=${{ github.event.inputs.qt_branch }}" >> $GITHUB_OUTPUT
          else
            echo "qt_branch=${{ env.QT_BRANCH }}" >> $GITHUB_OUTPUT
          fi
          
  build-windows:
    needs: setup
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [release]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout Qt
        uses: actions/checkout@v6
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 0
          submodules: false
          
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
            
      - name: Install dependencies
        run: choco install -y wget

      - name: Download mingw
        run: |
          set MINGW_ARCHIVE=x86_64-15.1.0-release-posix-seh-ucrt-rt_v12-rev0.7z
          wget https://github.com/niXman/mingw-builds-binaries/releases/download/15.1.0-rt_v12-rev0/%MINGW_ARCHIVE%
          7z x %MINGW_ARCHIVE%
        
      - name: Initialize Qt submodules
        run: init-repository.bat ${{ env.INIT_FLAGS }}
          
      - name: Configure
        run: |
          set "CC=%CD%\mingw64\bin\gcc"
          set "CXX=%CD%\mingw64/bin\g++"          
          set "CMAKE_C_COMPILER_LAUNCHER=sccache"
          set "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          set "OUTPUT_DIR=%CD%\qt-windows-mingw-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          mkdir build
          cd build
          
          ..\configure.bat -schannel -prefix "%OUTPUT_DIR%" ${{ env.SHARED_FLAGS }} -reduce-relocations ^
            -- ${{ env.WITH_STRIP_BUILD_FLAGS }} -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections"
      - name: List features
        run: configure.bat -list-features

      - name: Build Qt
        run: |
          cd build
          cmake --build . -j%NUMBER_OF_PROCESSORS%
          cmake --install .
          
      - name: Package artifacts
        run: |
          set "OUTPUT_NAME=qt-windows-mingw-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          7z a %OUTPUT_NAME%.zip .\%OUTPUT_NAME%\*
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: qt-windows-mingw
          path: ./qt-windows-mingw-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}.zip

  build-android:
    needs: setup
    runs-on: windows-2022
    strategy:
      matrix:
        build_type: [release]
        arch: [arm64-v8a, armeabi-v7a]
    defaults:
      run:
        shell: cmd
    steps:
      - name: Checkout Qt
        uses: actions/checkout@v6
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 0
          submodules: false
          
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          check-latest: true
      
      - name: Install dependencies
        run: choco install -y wget
        
      - name: Initialize Qt submodules
        run: init-repository.bat ${{ env.INIT_FLAGS }}

      - name: Download prebuilt Qt Host
        run: |
          mkdir qt-windows-mingw-release-dev
          cd qt-windows-mingw-release-dev
          set QT_ARCHIVE=qt-windows-mingw-release-dev.zip
          wget https://github.com/reg31/qt/releases/latest/download/%QT_ARCHIVE%
          7z x %QT_ARCHIVE%
          
      - name: Download prebuilt openssl
        run: |
          mkdir openssl
          cd openssl
          set OPENSSL_ARCHIVE=${{ env.OPENSSL_VERSION }}-${{ matrix.arch }}.zip
          wget https://github.com/reg31/openssl/releases/latest/download/%OPENSSL_ARCHIVE%
          7z x %OPENSSL_ARCHIVE%
    
      - name: Extract config folders
        run: |
          mkdir configFolders
          cd configFolders
          wget https://raw.githubusercontent.com/reg31/qt/main/files/android_bin.7z
          7z x android_bin.7z
          
      - name: Configure Android Qt
        run: |
          set "OUTPUT_DIR=%CD:\=/%/qt-android-${{ matrix.arch }}-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          set "QT_ROOT_DIR=%CD:\=/%/qt-windows-mingw-release-dev"
          set "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
          set "CMAKE_C_COMPILER_LAUNCHER=sccache"
          set "OPENSSL_ROOT=%CD:\=/%/openssl"
          
          mkdir build
          cd build
          
            ..\configure.bat -platform android-clang -prefix "%OUTPUT_DIR%" -qt-host-path "%QT_ROOT_DIR%" ${{ env.SHARED_FLAGS }} ${{ env.EXTRA_FLAGS }} ^
              -android-abis ${{ matrix.arch }} -android-ndk "%ANDROID_NDK_LATEST_HOME%" -reduce-relocations -platform android-clang ^
              -android-sdk "%ANDROID_SDK_ROOT%" -openssl-runtime -skip qtshadertools -android-javac-source ${{ env.JAVA_VERSION }} ^
              -android-javac-target ${{ env.JAVA_VERSION }} -- -DOPENSSL_ROOT_DIR="%OPENSSL_ROOT%" ${{ env.NO_STRIP_BUILD_FLAGS }} ^
              -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--pack-dyn-relocs=android+relr,--use-android-relr-tags,--gc-sections"
              
            
      - name: List features
        run: configure.bat -list-features          

      - name: Build Android Qt
        run: |
          cd build          
          cmake --build . -j%NUMBER_OF_PROCESSORS%
          cmake --install . --strip
          
      - name: Package artifacts
        run: |
          set "OUTPUT_NAME=qt-android-${{ matrix.arch }}-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}"
          Xcopy .\qt-windows-mingw-release-dev\bin\ .\%OUTPUT_NAME%\bin\ /c /i /s /y /r
          Xcopy .\configFolders\bin\ .\%OUTPUT_NAME%\bin\ /c /i /s /y /r
          7z a %OUTPUT_NAME%.zip .\%OUTPUT_NAME%\*
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: qt-android-${{ matrix.arch }}
          path: ./qt-android-${{ matrix.arch }}-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}.zip

  build-macos-x86_64:
    needs: setup
    runs-on: macos-15-intel
    strategy:
      matrix:
        build_type: [release]
    steps:      
      - name: Setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Checkout Qt
        uses: actions/checkout@v6
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 0
          submodules: false

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
      
      - name: Initialize Qt submodules
        run: perl init-repository ${{ env.INIT_FLAGS }}
   
      - name: Configure and build
        run: |
          OUTPUT_DIR=$(pwd)/qt-macos-x86_64-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}
          export CMAKE_CXX_COMPILER_LAUNCHER="ccache"
          export CMAKE_C_COMPILER_LAUNCHER="ccache"
          mkdir -p build
          cd build
          
          ../configure ${{ env.SHARED_FLAGS }} -securetransport -feature-appstore-compliant -prefix $OUTPUT_DIR \
          -- -DCMAKE_OSX_ARCHITECTURES="x86_64" ${{ env.NO_STRIP_BUILD_FLAGS }} -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-dead_strip"
          ../configure -list-features
          
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install . --strip
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: qt-macos-x86_64
          path: qt-macos-x86_64-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}

  build-macos-arm64:
    needs: setup
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [release]
    steps:
      - name: Setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
          
      - name: Checkout Qt
        uses: actions/checkout@v6
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 0
          submodules: false
          
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      
      - name: Initialize Qt submodules
        run: perl init-repository ${{ env.INIT_FLAGS }}
   
      - name: Configure and build
        run: |
          OUTPUT_DIR=$(pwd)/qt-macos-arm64-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}
          export CMAKE_CXX_COMPILER_LAUNCHER="sccache"
          export CMAKE_C_COMPILER_LAUNCHER="sccache"
          mkdir -p build
          cd build
          
          ../configure ${{ env.SHARED_FLAGS }} -securetransport -feature-appstore-compliant -prefix $OUTPUT_DIR \
          -- -DCMAKE_OSX_ARCHITECTURES="arm64" ${{ env.NO_STRIP_BUILD_FLAGS }} -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-dead_strip"
          ../configure -list-features
          
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install . --strip
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: qt-macos-arm64
          path: qt-macos-arm64-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}

  combine-macos:
    needs: [setup, build-macos-x86_64, build-macos-arm64]
    runs-on: macos-latest
    steps:
      - name: Download x86_64 build
        uses: actions/download-artifact@v7
        with:
          name: qt-macos-x86_64
          path: x86_64
          
      - name: Download arm64 build
        uses: actions/download-artifact@v7
        with:
          name: qt-macos-arm64
          path: arm64
          
      - name: Verify downloads
        run: |
          echo "x86_64 contents:"
          ls -la x86_64/
          echo "arm64 contents:"
          ls -la arm64/
          
      - name: Create universal binaries
        run: |
          BRANCH="${{ needs.setup.outputs.qt_branch }}"
          OUTPUT_DIR="qt-macos-universal-release-${BRANCH}"
          
          mkdir -p "$OUTPUT_DIR"
          
          echo "Copying arm64 base structure..."
          cp -R arm64/* "$OUTPUT_DIR/"
          
          echo "Creating universal binaries..."
          find arm64 \( -type f -o -type l \) \( -name "*.dylib" -o -name "*.a" -o -perm +111 \) -print0 | while IFS= read -r -d '' arm64file; do
            relpath="${arm64file#arm64/}"
            x86file="x86_64/$relpath"
            outfile="$OUTPUT_DIR/$relpath"
            
            if [ -L "$outfile" ]; then
              continue
            fi
            
            if [ -f "$x86file" ] && [ -f "$arm64file" ]; then
              if file "$arm64file" | grep -q "Mach-O"; then
                echo "Creating universal binary: $relpath"
                lipo -create "$x86file" "$arm64file" -output "$outfile" 2>/dev/null || {
                  echo "Warning: Failed to create universal binary for $relpath"
                }
              fi
            fi
          done
          
          echo "Universal binary creation complete"
          
      - name: Package universal build
        run: |
          BRANCH="${{ needs.setup.outputs.qt_branch }}"
          OUTPUT_NAME="qt-macos-release-${BRANCH}"
          UNIVERSAL_DIR="qt-macos-universal-release-${BRANCH}"

          find . -type f -exec chmod +x {} +
          7z a "${OUTPUT_NAME}.zip" "./${UNIVERSAL_DIR}/"*
          
      - name: Upload universal build
        uses: actions/upload-artifact@v6
        with:
          name: qt-macos
          path: qt-macos-release-${{ needs.setup.outputs.qt_branch }}.zip

  build-ios:
    needs: setup
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [release]
    steps:
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9
        
      - name: Setup xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
    
      - name: Checkout Qt
        uses: actions/checkout@v6
        with:
          repository: qt/qt5
          ref: ${{ needs.setup.outputs.qt_branch }}
          fetch-depth: 0
          submodules: false
      
      - name: Initialize Qt submodules
        run: perl init-repository ${{ env.INIT_FLAGS }}
      
      - name: Download prebuilt Qt Host
        run: |
          mkdir -p qt-macos-release-dev
          cd qt-macos-release-dev
          QT_ARCHIVE=qt-macos-release-dev.zip
          wget https://github.com/reg31/qt/releases/latest/download/$QT_ARCHIVE
          7z x $QT_ARCHIVE

      - name: Fix permissions
        run: find . -type f -exec chmod +x {} +              
        
      - name: Configure and build for iOS
        run: | 
          OUTPUT_DIR=$(pwd)/qt-ios-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}
          export CMAKE_CXX_COMPILER_LAUNCHER="sccache"
          export CMAKE_C_COMPILER_LAUNCHER="sccache"
          HOST_PATH=$(pwd)/qt-macos-release-dev
          mkdir -p build
          cd build
          
          ../configure -platform macx-ios-clang ${{ env.SHARED_FLAGS }} ${{ env.EXTRA_FLAGS }} -securetransport -feature-appstore-compliant \
          -skip qtshadertools -gc-binaries -prefix $OUTPUT_DIR -qt-host-path $HOST_PATH -- -DCMAKE_OSX_ARCHITECTURES="arm64" \
          -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod -O2 -DNDEBUG" -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod -O2 -DNDEBUG"
          ../configure -list-features
          
          cmake --build . -j$(sysctl -n hw.ncpu)
          cmake --install . --strip
          
      - name: Package artifacts
        run: |
          OUTPUT_NAME=qt-ios-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}
          find ./$OUTPUT_NAME -type f -exec chmod +x {} +
          7z a $OUTPUT_NAME.zip ./$OUTPUT_NAME/*
          
      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: qt-ios
          path: qt-ios-${{ matrix.build_type }}-${{ needs.setup.outputs.qt_branch }}.zip

  release:
    needs: [setup, build-windows, build-android, combine-macos, build-ios]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build-windows.result == 'success' && needs.combine-macos.result == 'success'}}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
          
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: "Qt Library - Build"
          fail_on_unmatched_files: false
          body: |
            Automated build of Qt ${{ needs.setup.outputs.qt_branch }} branch
            With qtbase and qtdeclarative, some features are disabled to minimize footprint
            
            This build includes binaries for:
            - Windows MINGW (x64)
            - Android (armeabi-v7a, arm64-v8a)
            - iOS
            - macOS (Universal Binary)
          files: |
            qt-windows-mingw/*.zip
            qt-android-armeabi-v7a/*.zip
            qt-android-arm64-v8a/*.zip
            qt-macos/*.zip
            qt-ios/*.zip
          
      - name: Cleanup repository
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 3
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
